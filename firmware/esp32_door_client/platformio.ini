; PlatformIO Configuration for A1 Fitness ESP32 Door Client
; 
; Install PlatformIO: https://platformio.org/install
; Then run: pio run --target upload

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Libraries
lib_deps = 
    ; WebSockets library with SocketIOclient (supports Socket.IO v4 / EIO=4)
    https://github.com/links2004/arduinoWebSockets#master
    ; JSON parsing
    bblanchon/ArduinoJson@^7.0.0

; Build flags
build_flags = 
    -DCORE_DEBUG_LEVEL=0

; Disable parallel builds (can help on Windows/OneDrive)
build_unflags = -j

; Custom partitions (optional, default is fine)
; board_build.partitions = default_16MB.csv